# fly.toml - Fly.io deployment config for Planning Poker
# Deploy with: fly launch (first time) or fly deploy (subsequent)

app = "planning-poker-dbyoder"
primary_region = "iad"  # US East — change to nearest: lhr=London, syd=Sydney, etc.

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false   # keep always-on (no sleep)
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
